name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FreeRehabHub.sln

      - name: Build
        run: dotnet build FreeRehabHub.sln --no-restore --configuration Debug

      - name: Test
        run: dotnet test FreeRehabHub.sln --no-build --configuration Debug

  # GUT (Godot Unit Test) sadece GDScript içindir, bu proje tamamen C# olduğu için kullanılmadı
  # (bkz. tests/scene-tests/SceneTestRunner.cs). Bunun yerine gerçek Godot çalışma zamanında
  # (headless, Xvfb altında) sahne/controller davranışını doğrulayan özel test harness'ı burada
  # çalıştırılıyor. Şimdilik sadece ubuntu-latest: Xvfb Linux'a özgü bir araç, Windows/macOS
  # headless çalıştırma zaten sanal framebuffer gerektirmiyor — ihtiyaç olursa ayrıca eklenir.
  scene-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_ZIP_URL: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_linux_x86_64.zip
      GODOT_BIN: godot-bin/Godot_v4.7-stable_mono_linux_x86_64/Godot_v4.7-stable_mono_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FreeRehabHub.sln

      - name: Build
        run: dotnet build FreeRehabHub.sln --no-restore --configuration Debug

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Download Godot (.NET/Mono)
        run: |
          curl -L -o godot.zip "$GODOT_ZIP_URL"
          unzip -q godot.zip -d godot-bin
          chmod +x "$GODOT_BIN"

      - name: Import project resources
        run: xvfb-run -a "$GODOT_BIN" --headless --import --quit

      - name: Run scene tests
        env:
          FREEREHABHUB_RUN_SCENE_TESTS: "1"
        run: xvfb-run -a "$GODOT_BIN" --headless --path .

  # TTS'in Türkçe ses paketi Windows/macOS'ta doğrulanmadı riskinin (bkz. CLAUDE.md §14)
  # doğrulama adımı. --headless modda DisplayServer.HasFeature(TextToSpeech) HER PLATFORMDA hep
  # false dönüyor (yerel bir spike'la doğrulandı) — bu yüzden scene-tests'in aksine PENCERELİ
  # (Linux'ta Xvfb altında, Windows/macOS'ta doğrudan — bu runner'ların zaten gerçek bir masaüstü
  # oturumu var) çalıştırılması gerekiyor. Godot mono zip asset adları/macOS app-bundle yolu
  # GitHub'ın godotengine/godot releases API'sinden gerçek dosya listesi çekilerek doğrulandı
  # (tahmin edilmedi) — Windows: Godot_v4.7-stable_mono_win64.zip, macOS:
  # Godot_v4.7-stable_mono_macos.universal.zip (Godot_mono.app/Contents/MacOS/Godot).
  tts-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot_zip_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_linux_x86_64.zip
            godot_bin: godot-bin/Godot_v4.7-stable_mono_linux_x86_64/Godot_v4.7-stable_mono_linux.x86_64
          - os: windows-latest
            godot_zip_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_win64.zip
            godot_bin: godot-bin/Godot_v4.7-stable_mono_win64/Godot_v4.7-stable_mono_win64.exe
          - os: macos-latest
            godot_zip_url: https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_macos.universal.zip
            godot_bin: godot-bin/Godot_mono.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    env:
      GODOT_ZIP_URL: ${{ matrix.godot_zip_url }}
      GODOT_BIN: ${{ matrix.godot_bin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FreeRehabHub.sln

      - name: Build
        run: dotnet build FreeRehabHub.sln --no-restore --configuration Debug

      - name: Install Xvfb and speech-dispatcher (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb speech-dispatcher espeak-ng

      - name: Download Godot (.NET/Mono)
        shell: bash
        run: |
          curl -L -o godot.zip "$GODOT_ZIP_URL"
          unzip -q godot.zip -d godot-bin
          chmod +x "$GODOT_BIN"

      - name: Import project resources (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a "$GODOT_BIN" --headless --import --quit

      - name: Import project resources (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          "$GODOT_BIN" --headless --import --quit

      - name: Run TTS check (Linux, windowed via Xvfb)
        if: runner.os == 'Linux'
        env:
          FREEREHABHUB_RUN_TTS_CHECK: "1"
        run: xvfb-run -a "$GODOT_BIN" --path .

      - name: Run TTS check (Windows/macOS, windowed natively)
        if: runner.os != 'Linux'
        shell: bash
        env:
          FREEREHABHUB_RUN_TTS_CHECK: "1"
        run: |
          "$GODOT_BIN" --path .

  mediapipe-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: services/mediapipe-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxcb1 libxext6 libsm6 libgles2 libegl1

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        run: python build_exe.py

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./dist/mediapipe-service/mediapipe-service --host 127.0.0.1 --port 8123 &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/health 2>/dev/null | grep -q 200; then
              echo "Health check OK"
              ok=1
              break
            fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "Health check failed"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\mediapipe-service\mediapipe-service.exe" -ArgumentList "--host 127.0.0.1 --port 8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8123/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                Write-Host "Health check OK"
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Host "Health check failed"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-service-${{ matrix.os }}
          path: services/mediapipe-service/dist/mediapipe-service
          retention-days: 7
