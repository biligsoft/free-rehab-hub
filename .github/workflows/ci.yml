name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FreeRehabHub.sln

      - name: Build
        run: dotnet build FreeRehabHub.sln --no-restore --configuration Debug

      - name: Test
        run: dotnet test FreeRehabHub.sln --no-build --configuration Debug
